<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MLAI Studio | Builder Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --bg:#0B0B0C; --line:#1e293b; --line-2:#2c3b54; --text:#fafafa; --muted:#94a3b8; --dim:#64748b;
  --violet:#8b5cf6; --violet-2:#a78bfa; --cyan:#22d3ee; --emerald:#34d399; --amber:#fbbf24;
  --glass:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.55 'Geist','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.006em;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,textarea{font:inherit;color:inherit}
h1,h2,h3,p,ol,ul{margin:0;padding:0}
ol,ul{list-style:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px}
em{font-style:normal}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(900px 520px at 12% -8%,rgba(139,92,246,.16),transparent 60%),
  radial-gradient(760px 480px at 100% 105%,rgba(34,211,238,.09),transparent 60%)}
.glow::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse 70% 50% at 50% 0%,#000,transparent);mask-image:radial-gradient(ellipse 70% 50% at 50% 0%,#000,transparent)}

/* ---------- shell ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px;padding:22px 16px 18px;background:rgba(11,11,12,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--line)}
.side::after{content:"";position:absolute;right:-1px;top:0;bottom:0;width:1px;background:linear-gradient(180deg,var(--violet),transparent 38%);opacity:.7;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;font-weight:600;font-size:15px;letter-spacing:-.02em}
.logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--violet),var(--cyan));box-shadow:0 0 22px -4px rgba(139,92,246,.8);color:#08080a}
.mode{display:grid;grid-template-columns:1.4fr 1fr;gap:4px;padding:4px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
.mode button{height:32px;border-radius:8px;font-size:13px;font-weight:500;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:8px;transition:color .2s,background .2s}
.mode button:hover{color:var(--text)}
.mode button.on{color:#fff;background:linear-gradient(180deg,rgba(139,92,246,.28),rgba(139,92,246,.1));box-shadow:inset 0 0 0 1px rgba(139,92,246,.5),0 0 20px -6px rgba(139,92,246,.8)}
.mdot{width:6px;height:6px;border-radius:50%;background:var(--violet-2);box-shadow:0 0 8px var(--violet);animation:pulse-v 2.4s infinite}
nav{display:flex;flex-direction:column;gap:2px}
.nav-item{position:relative;display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;color:var(--muted);font-weight:500;text-align:left;transition:background .2s,color .2s,transform .15s}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav-item:active{transform:scale(.98)}
.nav-item.on{background:rgba(139,92,246,.1);color:#fff}
.nav-item.on::before{content:"";position:absolute;left:-16px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--violet-2);box-shadow:0 0 12px var(--violet)}
.nav-item .lk{margin-left:auto;color:var(--dim);display:flex}
.who{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--glass);text-align:left;transition:border-color .2s,background .2s}
.who:hover{border-color:var(--line-2)}
.avatar{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff;background:linear-gradient(#141418,#141418) padding-box,linear-gradient(135deg,var(--violet),var(--cyan)) border-box;border:1.5px solid transparent}
.who-t{min-width:0;flex:1}
.who-n{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-s{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.sdot.review{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.sdot.verified{background:var(--emerald);box-shadow:0 0 8px var(--emerald)}
.sdot.changes{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.top{display:none}
.main{min-width:0;width:100%;max-width:1220px;margin:0 auto;padding:44px clamp(20px,4vw,56px) 120px}
#view.in{animation:viewin .28s ease both}
@keyframes viewin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- type + primitives ---------- */
.h1{font-size:clamp(30px,4.4vw,46px);line-height:1.04;letter-spacing:-.04em;font-weight:600}
.lead{color:var(--muted);font-size:15px;margin-top:10px;max-width:60ch}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.head-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted)}
.card{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card h2{font-size:16px;font-weight:600;letter-spacing:-.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-weight:500;white-space:nowrap;transition:transform .15s,background .2s,border-color .2s,box-shadow .2s,opacity .2s}
.btn:hover{background:rgba(255,255,255,.07);border-color:var(--line-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:#fafafa;color:#0b0b0c;border-color:#fafafa}
.btn.primary:hover{background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.08)}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.badge{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:500;border:1px solid var(--line-2);background:rgba(255,255,255,.04);color:#cbd5e1;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.b-review{color:#a5f3fc;border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.08)}
.b-review .dot{background:var(--cyan);animation:pulse-c 1.8s infinite}
.b-verified{color:#a7f3d0;border-color:rgba(52,211,153,.55);background:linear-gradient(180deg,rgba(52,211,153,.18),rgba(52,211,153,.06));box-shadow:0 0 24px -4px rgba(52,211,153,.55)}
.b-verified svg{color:var(--emerald);filter:drop-shadow(0 0 5px var(--emerald))}
.b-changes{color:#fde68a;border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.08)}
.b-changes .dot{background:var(--amber)}
@keyframes pulse-c{0%{box-shadow:0 0 0 0 rgba(34,211,238,.65)}70%{box-shadow:0 0 0 9px rgba(34,211,238,0)}100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}}
@keyframes pulse-v{0%{box-shadow:0 0 0 0 rgba(139,92,246,.6)}70%{box-shadow:0 0 0 7px rgba(139,92,246,0)}100%{box-shadow:0 0 0 0 rgba(139,92,246,0)}}

/* ---------- dashboard ---------- */
.dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.span12{grid-column:span 12}.span7{grid-column:span 7}.span5{grid-column:span 5}
.prog{padding:28px 28px 24px;overflow:hidden}
.prog::before{content:"";position:absolute;inset:0;background:radial-gradient(520px 200px at 0% 0%,rgba(139,92,246,.12),transparent 70%);pointer-events:none}
.prog-head{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.count{display:flex;align-items:baseline;gap:2px;font-variant-numeric:tabular-nums}
.count b{font-size:44px;line-height:1;font-weight:600;letter-spacing:-.05em}
.count span{font-size:24px;color:var(--dim);font-weight:500}
.count em{margin-left:10px;color:var(--muted);font-size:13.5px}
.rail{position:relative;display:grid;grid-template-columns:repeat(6,1fr);margin-top:34px}
.rail-track{position:absolute;top:13px;left:calc(100% / 12);right:calc(100% / 12);height:2px;border-radius:2px;background:var(--line)}
.rail-fill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p) * 100%);border-radius:2px;background:linear-gradient(90deg,var(--violet),var(--cyan));box-shadow:0 0 14px rgba(34,211,238,.65);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.step{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 6px;text-align:center;border-radius:12px}
.node{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:1.5px solid var(--line-2);color:var(--dim);font-size:12px;font-weight:600;transition:transform .2s,box-shadow .3s,background .3s,border-color .3s}
.step:hover .node{transform:scale(1.1)}
.step.done .node{background:linear-gradient(135deg,var(--violet),var(--cyan));border-color:transparent;color:#07070a;box-shadow:0 0 20px -2px rgba(139,92,246,.75)}
.step.current .node{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 0 4px rgba(34,211,238,.1),0 0 22px rgba(34,211,238,.35);animation:pulse-c 2s infinite}
.step b{display:block;font-weight:500;font-size:13.5px;color:#cbd5e1;line-height:1.3}
.step.done b,.step.current b{color:#fff}
.step small{display:block;margin-top:2px;color:var(--dim);font-size:12px;line-height:1.35}
.step.current small{color:#67e8f9}
.next{position:relative;margin-top:28px;padding:16px 18px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.next p{max-width:56ch}
.next strong{font-weight:600}

.sub{padding:26px}
.sub-h{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.sub-h p{color:var(--muted);margin-top:4px;max-width:44ch}
.reqcount{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.meter-bar{height:4px;border-radius:4px;background:var(--line);margin:18px 0 6px;overflow:hidden}
.meter-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--violet),var(--cyan));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.reqs{display:grid;gap:2px;margin-bottom:20px}
.req{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;margin:0 -10px;width:calc(100% + 20px);border-radius:10px;text-align:left;color:var(--muted);transition:background .2s,color .2s}
.req:hover{background:rgba(255,255,255,.04);color:var(--text)}
.req .ck{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-2);color:transparent;transition:all .25s}
.req.d{color:#e2e8f0}
.req.d .ck{background:var(--emerald);border-color:var(--emerald);color:#04130d;box-shadow:0 0 12px -2px rgba(52,211,153,.7)}
.req .fix{margin-left:auto;font-size:12.5px;color:var(--violet-2);opacity:0;transition:opacity .2s}
.req:hover .fix{opacity:1}
.req.d .fix{display:none}
.cta{position:relative;overflow:hidden;width:100%;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.01em;transition:transform .15s,box-shadow .3s,filter .2s}
.cta.locked{background:rgba(255,255,255,.03);border:1px dashed var(--line-2);color:var(--dim);font-weight:500}
.cta.locked:hover{border-color:var(--dim);color:var(--muted)}
.cta.ready{color:#fff;background:linear-gradient(135deg,#7c3aed,#8b5cf6 45%,#22d3ee);box-shadow:0 0 0 1px rgba(167,139,250,.5),0 10px 40px -10px rgba(139,92,246,.9),0 0 60px -18px rgba(34,211,238,.8)}
.cta.ready:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 0 0 1px rgba(167,139,250,.7),0 16px 48px -10px rgba(139,92,246,1),0 0 70px -14px rgba(34,211,238,.9)}
.cta.ready:active{transform:scale(.98)}
.cta.ready::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);transition:left .7s ease}
.cta.ready:hover::after{left:120%}
.cta.unlock::after{animation:sheen 1.1s .35s ease 1}
.cta.unlock{animation:unlock .6s ease 1}
@keyframes sheen{from{left:-40%}to{left:130%}}
@keyframes unlock{0%{transform:scale(.98)}50%{transform:scale(1.015)}100%{transform:none}}
.cta.shake{animation:shake .4s ease}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.sent{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;border:1px solid rgba(34,211,238,.3);background:rgba(34,211,238,.06);color:#cffafe}
.sent.ok{border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.07);color:#d1fae5;box-shadow:0 0 30px -12px rgba(52,211,153,.7)}
.sent svg{flex:none;margin-top:2px}
.sub.verified-card{border-color:rgba(52,211,153,.35)}

.stat{padding:26px}
.stat-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.tl{display:grid;gap:0}
.tl li{position:relative;display:grid;grid-template-columns:28px 1fr;gap:14px;padding-bottom:22px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li.done::before{background:linear-gradient(180deg,var(--violet),var(--cyan));box-shadow:0 0 8px rgba(139,92,246,.5)}
.tn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-2);background:var(--bg);color:var(--dim);z-index:1}
.tl .done .tn,.tl li.done .tn{background:linear-gradient(135deg,var(--violet),var(--cyan));border-color:transparent;color:#07070a}
.tl li.cur .tn{border-color:#e2e8f0;color:#fff}
.tl li.live .tn{border-color:var(--cyan);animation:pulse-c 1.8s infinite}
.tl li.live .tn::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.tl li.ok .tn{background:var(--emerald);border-color:var(--emerald);color:#04130d;box-shadow:0 0 22px rgba(52,211,153,.7)}
.tl li.warn .tn{background:var(--amber);border-color:var(--amber);color:#1a1100;box-shadow:0 0 18px rgba(251,191,36,.5)}
.tl h3{font-size:14px;font-weight:600;line-height:28px}
.tl li.todo h3{color:var(--dim)}
.tl p{color:var(--muted);font-size:13px;margin-top:2px;max-width:46ch}
.reason{margin-top:10px;padding:12px 14px;border-radius:10px;border:1px solid rgba(251,191,36,.35);background:rgba(251,191,36,.06);color:#fde68a;font-size:13px}

/* ---------- profile ---------- */
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.tabs{position:relative;display:inline-grid;grid-auto-flow:column;gap:2px;padding:4px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02);margin-bottom:20px;max-width:100%}
.tabs .thumb{position:absolute;top:4px;bottom:4px;left:0;width:var(--w,0);transform:translateX(var(--x,0));border-radius:8px;background:rgba(139,92,246,.16);box-shadow:inset 0 0 0 1px rgba(139,92,246,.45);transition:transform .3s cubic-bezier(.3,.9,.3,1),width .3s cubic-bezier(.3,.9,.3,1)}
.tab{position:relative;z-index:1;display:flex;align-items:center;gap:8px;height:34px;padding:0 16px;border-radius:8px;color:var(--muted);font-weight:500;transition:color .2s}
.tab:hover{color:var(--text)}
.tab.on{color:#fff}
.tab .tc{display:none;color:var(--emerald)}
.tab.done .tc{display:flex}
.fs{border:0;padding:0;margin:0;min-width:0;display:grid;gap:16px}
.fs:disabled{opacity:.62}
.fs:disabled .input,.fs:disabled textarea{cursor:not-allowed}
.panel-in{animation:viewin .25s ease both}
.sec{padding:22px 24px;display:grid;gap:18px}
.sec-h p{color:var(--muted);margin-top:3px;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.field{display:grid;gap:7px;min-width:0}
.field>span{font-size:12.5px;font-weight:500;color:#cbd5e1}
.field>span em{color:var(--dim);margin-left:6px;font-weight:400}
.input{width:100%;height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
.input::placeholder,textarea::placeholder{color:#475569}
.input:hover{border-color:var(--line-2)}
.input:focus,textarea:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(139,92,246,.2);background:rgba(255,255,255,.045)}
textarea{width:100%;min-height:120px;resize:vertical;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);outline:none;line-height:1.55;transition:border-color .2s,box-shadow .2s}
.affix{position:relative}
.affix>b{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--dim);font-weight:500;pointer-events:none}
.affix .input{padding-left:28px}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.hint{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--dim)}
.hint .ok{color:var(--emerald)}
.err{color:#fda4af;font-size:12.5px;min-height:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
.seg button{height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-weight:500;font-size:13px;transition:background .2s,color .2s,transform .15s}
.seg button:hover{color:var(--text)}
.seg button:active{transform:scale(.97)}
.seg button.on{background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 0 0 0 1px var(--line-2)}
.avdot{width:7px;height:7px;border-radius:50%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.focus{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.02);color:#cbd5e1;font-weight:500;font-size:13.5px;transition:all .2s}
.focus:hover{border-color:var(--line-2);color:#fff}
.focus:active{transform:scale(.97)}
.focus.on{border-color:rgba(167,139,250,.7);background:rgba(139,92,246,.14);color:#fff}
.focus.maxed{opacity:.4}
.focus .tick,.pill .tick{display:inline-grid;place-items:center;width:0;overflow:hidden;opacity:0;transition:width .2s,opacity .2s,margin .2s}
.focus.on .tick,.pill.on .tick{width:14px;margin-right:6px;opacity:1}
.chip-save{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;transition:color .3s}
.chip-save.saving{color:var(--violet-2)}
.chip-save svg{color:var(--emerald)}
.chip-save.saving svg{display:none}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;margin-bottom:20px;border:1px solid rgba(34,211,238,.3);background:rgba(34,211,238,.06);color:#cffafe}
.banner.warn{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.07);color:#fde68a}
.banner svg{flex:none;margin-top:2px}

/* skill matrix */
.skh{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.meter{display:flex;gap:4px;align-items:center}
.meter i{width:14px;height:6px;border-radius:3px;background:var(--line);transition:background .25s,box-shadow .25s}
.meter i.on{background:linear-gradient(90deg,var(--violet),var(--cyan));box-shadow:0 0 8px rgba(139,92,246,.7)}
.meter span{margin-left:10px;font-weight:600;font-variant-numeric:tabular-nums;font-size:13px;color:#cbd5e1}
.grp{display:grid;gap:12px}
.grp+.grp{padding-top:20px;border-top:1px solid var(--line)}
.grp-h{display:flex;align-items:center;gap:10px}
.grp-h i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.grp-h h3{font-size:14px;font-weight:600}
.grp-h p{color:var(--dim);font-size:12.5px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.02);color:#cbd5e1;font-weight:500;font-size:13.5px;transition:all .22s cubic-bezier(.3,.9,.3,1)}
.pill:hover{border-color:color-mix(in srgb,var(--c) 60%,#1e293b);color:#fff;transform:translateY(-1px)}
.pill:active{transform:scale(.95)}
.pill.on{color:#fff;border-color:var(--c);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 24%,transparent),color-mix(in srgb,var(--c) 8%,transparent));box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 35%,transparent),0 0 24px -4px color-mix(in srgb,var(--c) 75%,transparent)}
.pill.maxed{opacity:.38}
.pill.bump{animation:bump .3s ease}
@keyframes bump{40%{transform:scale(1.07)}}

/* proof */
.proof{padding:20px 22px;display:grid;gap:16px}
.proof-top{display:flex;gap:14px;align-items:center}
.btile{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line-2);background:rgba(255,255,255,.04);color:#e2e8f0;transition:all .3s}
.proof.on .btile{border-color:rgba(52,211,153,.5);color:#fff;box-shadow:0 0 20px -4px rgba(52,211,153,.6)}
.proof-top h3{font-size:14.5px;font-weight:600}
.proof-top p{color:var(--muted);font-size:13px}
.proof-top .state{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:#a7f3d0}
.state .dot{background:var(--emerald);box-shadow:0 0 8px var(--emerald)}
.pform{display:flex;gap:10px}
.pform .affix{flex:1;min-width:0}
.pform .affix .input{padding-left:var(--pad,110px)}
.pform .affix>b{font-size:13.5px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.meta{display:grid;gap:14px;padding:16px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3)}
.meta-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.meta-row .sp{margin-left:auto;display:flex;gap:8px}
.meta strong{font-weight:600}
.meta small{color:var(--dim);font-size:12.5px}
.repo{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12.5px;color:#cbd5e1}
.heat{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-template-columns:repeat(26,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:2px;background:rgba(255,255,255,.05)}
.heat .l1{background:rgba(52,211,153,.28)}.heat .l2{background:rgba(52,211,153,.5)}.heat .l3{background:rgba(52,211,153,.75)}.heat .l4{background:var(--emerald);box-shadow:0 0 6px rgba(52,211,153,.7)}
.heat.fresh i{opacity:0;transform:scale(.4);animation:cell .45s cubic-bezier(.3,.9,.3,1) forwards}
@keyframes cell{to{opacity:1;transform:none}}
.site{width:100%;max-width:240px;border-radius:8px;border:1px solid var(--line-2);overflow:hidden;background:#0f1013}
.site-bar{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line)}
.site-bar i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.site-body{padding:12px;display:grid;gap:6px}
.site-body i{display:block;height:6px;border-radius:3px;background:var(--line-2)}
.site-body i:first-child{width:55%;height:9px;background:linear-gradient(90deg,var(--violet),var(--cyan))}
.site-body i:nth-child(3){width:80%}.site-body i:nth-child(4){width:40%}

/* preview */
.pside{position:sticky;top:24px}
.preview{padding:22px;display:grid;gap:16px;overflow:hidden}
.preview::before{content:"";position:absolute;inset:0 0 auto 0;height:90px;background:linear-gradient(180deg,rgba(139,92,246,.18),transparent);pointer-events:none}
.pv-top{position:relative;display:flex;gap:14px;align-items:center}
.pv-top .avatar{width:52px;height:52px;font-size:17px}
.pv-top h3{font-size:16px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.pv-top p{color:var(--muted);font-size:13px;line-height:1.4;margin-top:2px}
.pv-line{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.pv-line b{color:var(--text);font-weight:500}
.pv-sk{display:flex;flex-wrap:wrap;gap:6px}
.sk{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;color:#e2e8f0;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 14%,transparent)}
.pv-empty{color:var(--dim);font-size:13px}
.pv-proof{display:flex;gap:8px;align-items:center;padding-top:14px;border-top:1px solid var(--line)}
.pv-proof span{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);color:#334155;transition:all .3s}
.pv-proof span.on{color:#fff;border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.08)}
.pv-proof small{margin-left:auto;color:var(--dim);font-size:12px}

/* locked + empty views */
.locked{position:relative;min-height:420px}
.ghost{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;filter:blur(7px);opacity:.55;pointer-events:none;user-select:none}
.ghost .card{padding:20px;display:grid;gap:12px;height:170px}
.ghost i{display:block;height:10px;border-radius:5px;background:var(--line-2)}
.ghost i:first-child{width:60%;height:14px;background:linear-gradient(90deg,var(--violet),var(--cyan))}
.ghost i:nth-child(3){width:85%}.ghost i:nth-child(4){width:45%}
.veil{position:absolute;inset:0;display:grid;place-items:center;padding:20px}
.veil-in{max-width:400px;text-align:center;display:grid;gap:12px;justify-items:center;padding:28px;border-radius:16px;border:1px solid var(--line);background:rgba(11,11,12,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.veil-in .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line-2);color:var(--violet-2);background:rgba(139,92,246,.1)}
.veil-in h2{font-size:18px}
.veil-in p{color:var(--muted)}

/* modal + toast + demo */
.modal-root{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:16px}
.modal-root.open{display:grid}
.scrim{position:absolute;inset:0;background:rgba(5,5,6,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fade .25s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{position:relative;width:min(468px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:30px;border-radius:20px;border:1px solid var(--line-2);background:linear-gradient(180deg,#121316,#0d0d0f);box-shadow:0 40px 120px -20px rgba(0,0,0,.9),0 0 90px -30px rgba(139,92,246,.6);animation:modal .32s cubic-bezier(.2,.9,.3,1) both}
@keyframes modal{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.msteps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:26px}
.msteps i{height:3px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.msteps i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--violet),var(--cyan));transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.3,.9,.3,1)}
.msteps i.on::after{transform:scaleX(1)}
.modal h2{font-size:22px;letter-spacing:-.03em;font-weight:600}
.modal .lead{font-size:14px;margin:6px 0 22px}
.mform{display:grid;gap:16px}
.rules{display:grid;gap:6px;margin-top:2px}
.rules li{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);transition:color .2s}
.rules li svg{opacity:.35;transition:all .2s}
.rules li.ok{color:#a7f3d0}.rules li.ok svg{opacity:1;color:var(--emerald)}
.check{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:13px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--violet);width:16px;height:16px}
.mfoot{display:flex;gap:10px;margin-top:24px}
.mfoot .btn{height:44px;flex:1}
.init{display:grid;gap:14px;margin:6px 0 4px}
.init li{display:flex;align-items:center;gap:12px;color:var(--dim);transition:color .3s}
.init li .ii{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-2);position:relative}
.init li:not(.done) .ii::after{content:"";width:10px;height:10px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:var(--cyan);animation:spin .8s linear infinite}
.init li.done{color:#fff}
.init li.done .ii{background:var(--emerald);border-color:var(--emerald);color:#04130d}
.init li.done .ii::after{display:none}
.init li .ii svg{display:none}.init li.done .ii svg{display:block}
.cfm{display:grid;gap:8px;margin:18px 0 0;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--muted);font-size:13px}
#toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:grid;gap:8px;justify-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:12px;border:1px solid var(--line-2);background:rgba(18,19,22,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 40px -8px rgba(0,0,0,.8);font-size:13.5px;animation:toast .35s cubic-bezier(.2,.9,.3,1) both}
.toast.out{animation:toastout .25s ease both}
.toast svg{flex:none;color:var(--emerald)}
.toast.info svg{color:var(--violet-2)}
@keyframes toast{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(8px)}}
.demo{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;display:grid;justify-items:end;gap:10px}
.demo-btn{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:rgba(18,19,22,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:13px;font-weight:500;color:var(--muted);transition:all .2s}
.demo-btn:hover{color:#fff;border-color:var(--dim)}
.demo-btn:active{transform:scale(.97)}
.demo-panel{display:none;width:268px;padding:14px;gap:6px;border-radius:14px;border:1px solid var(--line-2);background:rgba(14,14,16,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 24px 60px -12px rgba(0,0,0,.9)}
.demo.open .demo-panel{display:grid;animation:modal .25s ease both}
.demo-panel p{font-size:12px;color:var(--dim);padding:0 4px 6px}
.demo-panel .btn{justify-content:flex-start;height:34px;font-size:13px}
.demo-panel hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.scrim-nav{display:none}

/* ---------- auth, client, wallet ---------- */
.foot{margin-top:auto;display:grid;gap:8px}
.mode.client{grid-template-columns:1fr 1.4fr}
.mode.client button.on{background:linear-gradient(180deg,rgba(34,211,238,.24),rgba(34,211,238,.08));box-shadow:inset 0 0 0 1px rgba(34,211,238,.5),0 0 20px -6px rgba(34,211,238,.8)}
.mode.client .mdot{background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse-c 2.4s infinite}
.authtabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02);margin-bottom:22px}
.authtabs button{height:36px;border-radius:8px;font-weight:500;color:var(--muted);transition:background .2s,color .2s,transform .15s}
.authtabs button:hover{color:var(--text)}
.authtabs button:active{transform:scale(.97)}
.authtabs button.on{background:rgba(139,92,246,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(139,92,246,.5)}
.demoacc{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.demoacc p{width:100%;color:var(--dim);font-size:12.5px;margin-bottom:2px}
.modal.wide{width:min(640px,100%)}
.proj{padding:24px;display:grid;gap:18px}
.proj-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ctile{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:-.02em;border:1px solid var(--line-2);background:rgba(255,255,255,.05)}
.proj h2{font-size:20px;letter-spacing:-.03em;line-height:1.25}
.proj .sum{color:var(--muted);max-width:68ch}
.proj h3{font-size:14px;font-weight:600;margin-bottom:8px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fact{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25)}
.fact small{display:block;color:var(--dim);font-size:12px}
.fact b{font-weight:600}
.proj-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sk.miss{--c:#64748b;opacity:.55}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.tile{padding:20px 22px}
.tile small{color:var(--muted);font-size:13px}
.tile b{display:block;margin-top:6px;font-size:28px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ms{display:grid;gap:10px;counter-reset:m}
.ms li{display:flex;gap:12px;align-items:flex-start;color:#cbd5e1}
.ms li::before{counter-increment:m;content:counter(m);flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;border:1px solid var(--line-2);color:#cbd5e1}
.irow{display:flex;align-items:center;gap:14px;padding:16px 0;flex-wrap:wrap}
.irow+.irow{border-top:1px solid var(--line)}
.irow .grow{flex:1;min-width:200px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:12px;margin-top:18px}
@media (max-width:720px){.facts,.tiles{grid-template-columns:1fr}}

.b-sp{color:#ddd6fe;border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.14)}
.b-st{color:#a5f3fc;border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.08)}
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:stretch}
.bgrid .proj{align-content:start}
.bgrid .proj-foot{align-self:end}
.bgrid .facts{grid-template-columns:1.7fr 1fr 1fr}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:1100px){.bgrid{grid-template-columns:1fr}}
.side nav{flex:1;min-height:0;overflow:auto}
.mission{display:grid;gap:3px;padding:14px;border-radius:12px;border:1px solid var(--line);background:radial-gradient(220px 90px at 0% 0%,rgba(139,92,246,.18),transparent 70%),var(--glass)}
.mission small{color:var(--violet-2);font-weight:500;font-size:12px}
.mission b{font-weight:600;font-size:13.5px;line-height:1.35;letter-spacing:-.015em}
.mission span{color:var(--dim);font-size:12px}
@media (max-height:760px){.mission{display:none}}
.about{padding:24px 26px;display:grid;grid-template-columns:1.25fr repeat(3,1fr);gap:24px;align-items:center}
.about p{color:var(--muted);margin-top:6px;max-width:34ch}
.about .st b{display:block;font-size:26px;font-weight:600;letter-spacing:-.04em;line-height:1.1}
.about .st small{display:block;margin-top:4px;color:var(--muted);font-size:12.5px;line-height:1.4}
@media (max-width:1100px){.about{grid-template-columns:repeat(3,1fr)}.about>div:first-child{grid-column:1/-1}}
@media (max-width:720px){.about{grid-template-columns:1fr}}
/* ---------- responsive ---------- */
@media (max-width:1180px){
  .pgrid{grid-template-columns:1fr}
  .pside{position:static;order:-1}
  .preview{grid-template-columns:1fr}
}
@media (max-width:1100px){
  .span7,.span5{grid-column:span 12}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;z-index:70;left:0;top:0;bottom:0;height:auto;width:min(300px,86vw);padding-top:calc(22px + env(safe-area-inset-top,0px));transform:translateX(-102%);transition:transform .32s cubic-bezier(.3,.9,.3,1)}
  body.nav-open .side{transform:none}
  .scrim-nav{position:fixed;inset:0;z-index:65;background:rgba(5,5,6,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  body.nav-open .scrim-nav{display:block;animation:fade .25s both}
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(11,11,12,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  .top .brand{margin-right:auto}
  .top .menu{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line)}
  .main{padding-top:28px}
  .ghost{grid-template-columns:1fr}
  .ghost .card:nth-child(n+2){display:none}
}
@media (max-width:720px){
  .rail{grid-template-columns:1fr;gap:2px;margin-top:24px}
  .rail-track{top:22px;bottom:22px;left:13px;right:auto;width:2px;height:auto}

  .step{flex-direction:row;align-items:flex-start;text-align:left;gap:14px;padding:8px 0}
  .step>div{padding-top:3px}
  .prog,.sub,.stat{padding:22px 18px}
  .grid2,.grid3{grid-template-columns:1fr}
  .pform{flex-direction:column}
  .pform .btn{height:42px}
  .modal{padding:24px 20px}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
  .tab{justify-content:center;padding:0 8px}
  .demo{right:12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

<div class="glow" aria-hidden="true"></div>
<div class="scrim-nav" data-action="menu"></div>

      <span class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18V6l7 7 7-7v12"/></svg></span>
      <span>MLAI Studio</span>

  </aside>

/* ============ proof parsing ============ */
function parseProof(k,raw){
  raw=raw.trim();if(!raw)return{err:'Enter a link or username first.'};
  if(k==='github'){
    let h=raw.replace(/^@/,'');const m=raw.match(/github\.com\/([^\/\s?#]+)/i);if(m)h=m[1];
    if(!/^[a-z\d](?:[a-z\d]|-(?=[a-z\d])){0,38}$/i.test(h))return{err:'Use a GitHub username or a github.com/username link.'};
    return{data:{handle:h,repo:REPOS[hash(h)%REPOS.length]}};
  }
  if(k==='linkedin'){
    const m=raw.match(/linkedin\.com\/in\/([\w\-%]{3,100})/i)||(/^[\w\-%]{3,100}$/.test(raw)?[0,raw]:null);
    if(!m)return{err:'Use a linkedin.com/in/your-name link or just the part after /in/.'};
    const slug=decodeURIComponent(m[1]).replace(/\/$/,'');
    const name=slug.replace(/-[0-9a-f]{5,}$/i,'').split('-').filter(Boolean).map(cap).join(' ');
    return{data:{slug,name:name||slug}};
  }
  let u;try{u=new URL(/^https?:\/\//i.test(raw)?raw:'https://'+raw)}catch(e){return{err:'That does not look like a web address. Try yourname.dev.'}}
  if(!u.hostname.includes('.')||/\s/.test(raw))return{err:'That does not look like a web address. Try yourname.dev.'};
  if(/(^|\.)(github|linkedin)\.com$/i.test(u.hostname))return{err:'Use the GitHub and LinkedIn cards above for those. Add your own site here.'};
  return{data:{host:u.hostname.replace(/^www\./,''),url:u.origin+(u.pathname==='/'?'':u.pathname)}};
}
function connect(k){
  const el=$('#in-'+k);const raw=el?el.value:S.draft[k];S.draft[k]=raw;
  const r=parseProof(k,raw);
  if(r.err){S.perr[k]=r.err;renderProof(k);const i=$('#in-'+k);i&&i.focus();return}
  S.perr[k]='';S.syncing[k]=true;renderProof(k);
  setTimeout(()=>{S.syncing[k]=false;S.proof[k]=r.data;S.fresh=k;renderProof(k);S.fresh=null;afterEdit();saveChip();toast(PM[k].t+' connected')},1100);
}

  'demo-approve':()=>review(true),
  'demo-reject':()=>review(false),
  'demo-reset':()=>{seedUsers();S=fresh();$('#demo').classList.remove('open');closeModal();render();openAccount('signin')}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]');
  if(t){const f=ACTIONS[t.dataset.action];if(f&&!t.disabled)f(t,e);return}
  if(e.target.id==='mscrim'&&$('#modalRoot').dataset.dismiss)closeModal();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.acc){A[t.dataset.acc]=t.type==='checkbox'?t.checked:t.value;accUpdate();return}
  if(t.dataset.pf){const k=t.dataset.pf;S.draft[k]=t.value;if(S.perr[k]){S.perr[k]='';const e2=$('#err-'+k);if(e2)e2.textContent=''}return}
  if(t.dataset.bind){
    const k=t.dataset.bind;S.profile[k]=t.value;
    if(k==='bio'){const n=t.value.trim().length,h=$('#bio-hint');$('#bio-count').textContent=t.value.length+'/400';h.textContent=n>=40?'Long enough':'40 characters minimum';h.classList.toggle('ok',n>=40)}
    if(k==='rateMin'||k==='rateMax'){const a=+S.profile.rateMin,b=+S.profile.rateMax;$('#rate-err').textContent=(a>0&&b>0&&b<a)?'The upper rate must be at least the lower rate.':''}
    afterEdit();saveChip();
  }
});
document.addEventListener('change',e=>{if(e.target.dataset.acc==='agree'){A.agree=e.target.checked;accUpdate()}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modalRoot').dataset.dismiss&&$('#modalRoot').classList.contains('open'))closeModal();document.body.classList.remove('nav-open')}
  if(e.key==='Enter'){
    const t=e.target;
    if(t.dataset&&t.dataset.pf){e.preventDefault();connect(t.dataset.pf)}
    else if(t.closest&&t.closest('#modal')&&t.tagName==='INPUT'&&t.type!=='checkbox'){const b=$('#modal .btn.primary');if(b&&!b.disabled){e.preventDefault();b.click()}}
  }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.step[data-action]')){e.preventDefault();e.target.click()}
});
window.addEventListener('resize',moveThumb);

/* ============ boot ============ */
seedUsers();render();openAccount('signin');
</script>
</body>
</html>
